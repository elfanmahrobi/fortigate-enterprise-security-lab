# Conservative custom profiles for a FortiOS 7.6.x lab.
# FortiGuard category IDs and supported options can vary by build and license.

config antivirus profile
    edit "AV-CORPORATE"
        set comment "Lab antivirus profile for corporate and guest internet policies"
        set feature-set flow
        config http
            set options scan
        end
        config ftp
            set options scan
        end
    next
end

config ips sensor
    edit "IPS-CORPORATE"
        set comment "Block critical and high severity signatures"
        config entries
            edit 1
                set location client
                set severity critical high
                set action block
                set log enable
            next
            edit 2
                set location server
                set severity critical high
                set action block
                set log enable
            next
        end
    next
    edit "IPS-PROTECT-SERVER"
        set comment "Protect internet-facing and internal servers"
        config entries
            edit 1
                set location server
                set severity critical high medium
                set action block
                set log enable
            next
        end
    next
end

config webfilter profile
    edit "WEB-CORPORATE"
        set comment "Corporate web filtering baseline"
        set feature-set flow
        config web
            set bword-threshold 10
            set bword-table 0
        end
        set web-antiphishing-log enable
        set web-content-log enable
        set web-filter-activex-log enable
        set web-filter-command-block-log enable
        set web-filter-cookie-log enable
        set web-filter-cookie-removal-log enable
        set web-filter-js-log enable
        set web-filter-jscript-log enable
        set web-filter-referer-log enable
        set web-filter-unknown-log enable
    next
    edit "WEB-GUEST"
        set comment "Guest web filtering baseline"
        set feature-set flow
        set web-antiphishing-log enable
        set web-content-log enable
        set web-filter-unknown-log enable
    next
end

config dnsfilter profile
    edit "DNS-CORPORATE"
        set comment "Corporate DNS security baseline"
        set block-botnet enable
        set log-all-domain enable
    next
    edit "DNS-GUEST"
        set comment "Guest DNS security baseline"
        set block-botnet enable
        set log-all-domain enable
    next
end

config application list
    edit "APP-CORPORATE"
        set comment "Corporate application visibility and control"
        set unknown-application-log enable
        config entries
            edit 1
                set category 2 6
                set action block
                set log enable
            next
        end
    next
    edit "APP-GUEST"
        set comment "Guest application control baseline"
        set unknown-application-log enable
        config entries
            edit 1
                set category 2 6
                set action block
                set log enable
            next
        end
    next
end

# Review category IDs and FortiGuard connectivity in the actual lab before use.
# The built-in "certificate-inspection" profile is referenced by firewall policies.
