# Apply only to FGT-EDGE-01 using console access.
# Replace <SET-SECURE-HA-PASSWORD-LOCALLY> before use and never commit it.
config system global
    set hostname "FGT-EDGE-01"
end

config system ha
    set group-name "FGT-ENTERPRISE-HA"
    set group-id 10
    set mode a-p
    set password <SET-SECURE-HA-PASSWORD-LOCALLY>
    set hbdev "port5" 100 "port6" 50
    set session-pickup enable
    set override enable
    set priority 200
    set monitor "wan1" "wan2" "port3"
end
