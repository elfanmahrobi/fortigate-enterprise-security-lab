config firewall address
    edit "NET-CORP-USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-INTERNAL-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "NET-GUEST"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-MANAGEMENT"
        set subnet 10.10.40.0 255.255.255.0
    next
    edit "NET-DMZ"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-SECURITY"
        set subnet 10.10.60.0 255.255.255.0
    next
    edit "HOST-DC01"
        set subnet 10.10.20.10 255.255.255.255
    next
    edit "HOST-APP01"
        set subnet 10.10.20.20 255.255.255.255
    next
    edit "HOST-DB01"
        set subnet 10.10.20.30 255.255.255.255
    next
    edit "HOST-NTP01"
        set subnet 10.10.20.40 255.255.255.255
    next
    edit "HOST-WEB01"
        set subnet 10.10.50.10 255.255.255.255
    next
    edit "HOST-ADMIN01"
        set subnet 10.10.40.10 255.255.255.255
    next
    edit "HOST-LOG01"
        set subnet 10.10.60.10 255.255.255.255
    next
    edit "HOST-MONITOR01"
        set subnet 10.10.60.20 255.255.255.255
    next
    edit "RFC1918-10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918-172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918-192"
        set subnet 192.168.0.0 255.255.0.0
    next
end

config firewall addrgrp
    edit "GRP-RFC1918"
        set member "RFC1918-10" "RFC1918-172" "RFC1918-192"
    next
    edit "GRP-APPROVED-SERVERS"
        set member "HOST-DC01" "HOST-APP01" "HOST-NTP01" "HOST-WEB01"
    next
    edit "GRP-LOG-SOURCES"
        set member "HOST-DC01" "HOST-APP01" "HOST-WEB01" "HOST-MONITOR01"
    next
end
