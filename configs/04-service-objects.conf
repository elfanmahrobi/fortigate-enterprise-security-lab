config firewall service custom
    edit "DNS-TCP-UDP"
        set tcp-portrange 53
        set udp-portrange 53
    next
    edit "KERBEROS-TCP-UDP"
        set tcp-portrange 88
        set udp-portrange 88
    next
    edit "LDAP-TCP-UDP"
        set tcp-portrange 389
        set udp-portrange 389
    next
    edit "LDAPS-636"
        set tcp-portrange 636
    next
    edit "NTP-UDP-123"
        set udp-portrange 123
    next
    edit "POSTGRESQL-5432"
        set tcp-portrange 5432
    next
    edit "SYSLOG-TLS-6514"
        set tcp-portrange 6514
    next
    edit "SNMP-UDP-161"
        set udp-portrange 161
    next
end

config firewall service group
    edit "SVC-INTERNET-STANDARD"
        set member "DNS-TCP-UDP" "HTTP" "HTTPS"
    next
    edit "SVC-ACTIVE-DIRECTORY"
        set member "DNS-TCP-UDP" "KERBEROS-TCP-UDP" "LDAP-TCP-UDP" "LDAPS-636"
    next
    edit "SVC-FORTIGATE-MANAGEMENT"
        set member "HTTPS" "SSH" "PING"
    next
end
