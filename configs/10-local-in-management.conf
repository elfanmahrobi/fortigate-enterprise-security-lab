# Management GUI/SSH is enabled only on VLAN40-MGMT in interface config.
# Local-in policy further restricts access to HOST-ADMIN01.
config firewall local-in-policy
    edit 1
        set intf "VLAN40-MGMT"
        set srcaddr "HOST-ADMIN01"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "SSH" "PING"
        set schedule "always"
    next
    edit 2
        set intf "VLAN40-MGMT"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set service "HTTPS" "SSH"
        set schedule "always"
    next
end

# Set trusted hosts on a named administrator after creating a strong password.
# Do not publish credentials in GitHub.
config system admin
    edit "secadmin"
        set accprofile "super_admin"
        set trusthost1 10.10.40.10 255.255.255.255
        set comments "Lab administrator restricted to ADMIN01"
    next
end
