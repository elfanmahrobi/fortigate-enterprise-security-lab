config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "virtual-wan-link"
            set gateway 203.0.113.1
            set priority 1
        next
        edit 2
            set interface "wan2"
            set zone "virtual-wan-link"
            set gateway 198.51.100.1
            set priority 2
        next
    end
    config health-check
        edit "INTERNET-SLA"
            set server "1.1.1.1" "8.8.8.8"
            set protocol ping
            set members 1 2
            set update-static-route enable
            set interval 1000
            set failtime 5
            set recoverytime 5
        next
    end
    config service
        edit 1
            set name "DEFAULT-INTERNET"
            set mode priority
            set dst "all"
            set src "all"
            set health-check "INTERNET-SLA"
            set priority-members 1 2
        next
    end
end
