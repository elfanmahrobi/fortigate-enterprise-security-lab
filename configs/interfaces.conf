# FortiGate Enterprise Security Lab
# Sanitized interface and VLAN configuration
# Do not use directly in a production environment

config system interface
    edit "VLAN10-USERS"
        set vdom "root"
        set interface "port3"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Corporate User Network"
    next

    edit "VLAN20-SERVERS"
        set vdom "root"
        set interface "port3"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Internal Server Network"
    next

    edit "VLAN30-GUEST"
        set vdom "root"
        set interface "port3"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Guest Network"
    next

    edit "VLAN40-MGMT"
        set vdom "root"
        set interface "port3"
        set vlanid 40
        set ip 10.10.40.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set description "Restricted Management Network"
    next

    edit "VLAN50-DMZ"
        set vdom "root"
        set interface "port3"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set description "Public Service DMZ"
    next

    edit "VLAN60-SECURITY"
        set vdom "root"
        set interface "port3"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Security Monitoring Network"
    next
end
