# Sanitized lab baseline
config system global
    set hostname "FGT-EDGE-01"
    set admintimeout 10
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
end

config system dns
    set primary 1.1.1.1
    set secondary 8.8.8.8
end

config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.10.20.40"
        next
    end
end
