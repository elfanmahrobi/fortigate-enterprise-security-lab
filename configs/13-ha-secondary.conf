# Apply only to FGT-EDGE-02 using console access before joining the cluster.
# Use the same secure HA password as the primary without storing it in GitHub.
config system global
    set hostname "FGT-EDGE-02"
end

config system ha
    set group-name "FGT-ENTERPRISE-HA"
    set group-id 10
    set mode a-p
    set password <SET-SECURE-HA-PASSWORD-LOCALLY>
    set hbdev "port5" 100 "port6" 50
    set session-pickup enable
    set override enable
    set priority 100
    set monitor "wan1" "wan2" "port3"
end
