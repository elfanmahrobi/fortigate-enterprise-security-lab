# Policies are intentionally explicit and ordered by traffic path.
config firewall policy
    edit 10
        set name "CORP-USERS-to-INTERNET"
        set srcintf "VLAN10-USERS"
        set dstintf "virtual-wan-link"
        set srcaddr "NET-CORP-USERS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SVC-INTERNET-STANDARD"
        set inspection-mode flow
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "AV-CORPORATE"
        set ips-sensor "IPS-CORPORATE"
        set webfilter-profile "WEB-CORPORATE"
        set dnsfilter-profile "DNS-CORPORATE"
        set application-list "APP-CORPORATE"
        set nat enable
        set logtraffic all
        set comments "LAB-CHG-001 | Corporate internet access"
    next
    edit 20
        set name "CORP-USERS-to-APP01"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "NET-CORP-USERS"
        set dstaddr "HOST-APP01"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set inspection-mode flow
        set utm-status enable
        set ips-sensor "IPS-CORPORATE"
        set logtraffic all
        set comments "LAB-CHG-002 | HTTPS to internal application"
    next
    edit 21
        set name "CORP-USERS-to-DC01-DNS"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "NET-CORP-USERS"
        set dstaddr "HOST-DC01"
        set action accept
        set schedule "always"
        set service "DNS-TCP-UDP"
        set logtraffic all
        set comments "LAB-CHG-003 | Internal DNS"
    next
    edit 22
        set name "CORP-USERS-to-DC01-AUTH"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "NET-CORP-USERS"
        set dstaddr "HOST-DC01"
        set action accept
        set schedule "always"
        set service "SVC-ACTIVE-DIRECTORY"
        set inspection-mode flow
        set utm-status enable
        set ips-sensor "IPS-CORPORATE"
        set logtraffic all
        set comments "LAB-CHG-004 | Identity services; extend ports only after validation"
    next
    edit 23
        set name "CORP-USERS-to-NTP01"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "NET-CORP-USERS"
        set dstaddr "HOST-NTP01"
        set action accept
        set schedule "always"
        set service "NTP-UDP-123"
        set logtraffic all
    next
    edit 24
        set name "CORP-USERS-to-DB01-DENY"
        set srcintf "VLAN10-USERS"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "NET-CORP-USERS"
        set dstaddr "HOST-DB01"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 31
        set name "GUEST-to-RFC1918-DENY"
        set srcintf "VLAN30-GUEST"
        set dstintf "VLAN10-USERS" "VLAN20-SERVERS" "VLAN40-MGMT" "VLAN50-DMZ" "VLAN60-SECURITY"
        set srcaddr "NET-GUEST"
        set dstaddr "GRP-RFC1918"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 30
        set name "GUEST-to-INTERNET"
        set srcintf "VLAN30-GUEST"
        set dstintf "virtual-wan-link"
        set srcaddr "NET-GUEST"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SVC-INTERNET-STANDARD"
        set inspection-mode flow
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "AV-CORPORATE"
        set ips-sensor "IPS-CORPORATE"
        set webfilter-profile "WEB-GUEST"
        set dnsfilter-profile "DNS-GUEST"
        set application-list "APP-GUEST"
        set nat enable
        set logtraffic all
    next
    edit 40
        set name "INTERNET-to-DMZ-PORTAL"
        set srcintf "wan1"
        set dstintf "VLAN50-DMZ"
        set srcaddr "all"
        set dstaddr "VIP-PORTAL-HTTPS"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set inspection-mode flow
        set utm-status enable
        set ips-sensor "IPS-PROTECT-SERVER"
        set logtraffic all
        set comments "LAB-CHG-005 | Publish portal.example.com over HTTPS"
    next
    edit 50
        set name "WEB01-to-DB01"
        set srcintf "VLAN50-DMZ"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "HOST-WEB01"
        set dstaddr "HOST-DB01"
        set action accept
        set schedule "always"
        set service "POSTGRESQL-5432"
        set inspection-mode flow
        set utm-status enable
        set ips-sensor "IPS-PROTECT-SERVER"
        set logtraffic all
    next
    edit 51
        set name "WEB01-to-DNS"
        set srcintf "VLAN50-DMZ"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "HOST-WEB01"
        set dstaddr "HOST-DC01"
        set action accept
        set schedule "always"
        set service "DNS-TCP-UDP"
        set logtraffic all
    next
    edit 52
        set name "WEB01-to-NTP"
        set srcintf "VLAN50-DMZ"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "HOST-WEB01"
        set dstaddr "HOST-NTP01"
        set action accept
        set schedule "always"
        set service "NTP-UDP-123"
        set logtraffic all
    next
    edit 53
        set name "DMZ-to-INTERNAL-DENY"
        set srcintf "VLAN50-DMZ"
        set dstintf "VLAN20-SERVERS"
        set srcaddr "NET-DMZ"
        set dstaddr "NET-INTERNAL-SERVERS"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 61
        set name "DEVICES-to-LOG01"
        set srcintf "VLAN20-SERVERS" "VLAN50-DMZ" "VLAN60-SECURITY"
        set dstintf "VLAN60-SECURITY"
        set srcaddr "GRP-LOG-SOURCES"
        set dstaddr "HOST-LOG01"
        set action accept
        set schedule "always"
        set service "SYSLOG-TLS-6514"
        set logtraffic all
    next
    edit 62
        set name "MONITOR01-to-NETWORK"
        set srcintf "VLAN60-SECURITY"
        set dstintf "VLAN10-USERS" "VLAN20-SERVERS" "VLAN40-MGMT" "VLAN50-DMZ"
        set srcaddr "HOST-MONITOR01"
        set dstaddr "GRP-APPROVED-SERVERS"
        set action accept
        set schedule "always"
        set service "SNMP-UDP-161" "PING"
        set logtraffic all
    next
    edit 71
        set name "ADMIN01-to-SERVERS"
        set srcintf "VLAN40-MGMT"
        set dstintf "VLAN20-SERVERS" "VLAN50-DMZ"
        set srcaddr "HOST-ADMIN01"
        set dstaddr "GRP-APPROVED-SERVERS"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH"
        set inspection-mode flow
        set utm-status enable
        set ips-sensor "IPS-CORPORATE"
        set logtraffic all
    next
end

# FortiGate has an implicit deny. Optional explicit inter-zone deny rules may
# be added per interface pair for enhanced visibility; one multi-interface
# catch-all rule cannot represent every direction safely.
