# Confirm that log01 supports the selected transport before applying.
config log syslogd setting
    set status enable
    set server "10.10.60.10"
    set mode reliable
    set port 6514
    set facility local7
    set source-ip 10.10.60.1
    set format default
end

config log eventfilter
    set system enable
    set user enable
    set router enable
    set vpn enable
    set endpoint enable
    set ha enable
end
