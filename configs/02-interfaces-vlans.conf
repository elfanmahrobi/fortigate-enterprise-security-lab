# WAN transit and VLAN trunk configuration
config system interface
    edit "wan1"
        set mode static
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set role wan
        set alias "ISP-1 Primary"
    next
    edit "wan2"
        set mode static
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set role wan
        set alias "ISP-2 Secondary"
    next
    edit "port3"
        set alias "802.1Q Trunk to Core Switch"
        set role lan
    next
    edit "VLAN10-USERS"
        set interface "port3"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set alias "Corporate Users"
    next
    edit "VLAN20-SERVERS"
        set interface "port3"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set alias "Internal Servers"
    next
    edit "VLAN30-GUEST"
        set interface "port3"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set alias "Guest Network"
    next
    edit "VLAN40-MGMT"
        set interface "port3"
        set vlanid 40
        set ip 10.10.40.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set alias "Restricted Management"
    next
    edit "VLAN50-DMZ"
        set interface "port3"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set alias "Public Services DMZ"
    next
    edit "VLAN60-SECURITY"
        set interface "port3"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping
        set role lan
        set alias "Security Monitoring"
    next
end
