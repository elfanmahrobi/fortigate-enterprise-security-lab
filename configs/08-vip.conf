config firewall vip
    edit "VIP-PORTAL-HTTPS"
        set comment "Routed public HTTPS address for portal.example.com"
        set extintf "wan1"
        set extip 203.0.113.10
        set mappedip "10.10.50.10"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedport 443
    next
end
